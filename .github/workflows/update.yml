name: Update Nodes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "aggregator.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate and probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python aggregator.py \
            --outdir out \
            --concurrency 4096 \
            --timeout 2.5 \
            --no-tls \
            --min-alive 20

      - name: Show summary
        if: always()
        run: |
          echo "### nodefusion result" >> $GITHUB_STEP_SUMMARY
          if [ -f out/nodes.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from collections import Counter
          d = json.load(open("out/nodes.json", encoding="utf-8"))
          m = d["meta"]
          print(f"- parsed: **{m['total_parsed']}**")
          print(f"- alive: **{m['alive']}** ({m['alive_rate']}%)")
          print(f"- elapsed: {m['elapsed_ms']} ms")
          print("")
          print("| scheme | count |")
          print("|---|---|")
          for k, v in Counter(n["scheme"] for n in d["nodes"]).most_common():
              print(f"| {k} | {v} |")
          PY
          else
            echo "no output produced" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit changes
        run: |
          git config user.name  "nodefusion-bot"
          git config user.email "nodefusion-bot@users.noreply.github.com"

          # out/ 完全由本脚本生成，任何远端差异都直接以本次结果为准
          git fetch origin main
          git reset --soft origin/main 2>/dev/null || true

          git add -A out/
          if git diff --cached --quiet; then
            echo "no changes in out/"
            exit 0
          fi

          ALIVE=$(python -c "import json;print(json.load(open('out/nodes.json',encoding='utf-8'))['count'])")
          git commit -m "chore: update nodes (${ALIVE} alive) $(date -u +%Y-%m-%dT%H:%MZ)"

          # 重试推送，避免与人工提交撞车
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, attempt $i - rebasing onto latest main"
            git fetch origin main
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git add -A out/
            git commit -m "chore: update nodes (${ALIVE} alive) $(date -u +%Y-%m-%dT%H:%MZ)" || true
            sleep 5
          done
          echo "push failed after 5 attempts" >&2
          exit 1