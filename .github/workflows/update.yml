name: Update Nodes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate and probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python aggregator.py \
            --outdir out \
            --concurrency 4096 \
            --timeout 2.5 \
            --tls-timeout 3.0 \
            --no-tls \
            --min-alive 20

      - name: Show summary
        if: always()
        run: |
          echo "### nodefusion result" >> $GITHUB_STEP_SUMMARY
          if [ -f out/nodes.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("out/nodes.json", encoding="utf-8"))
          m = d["meta"]
          print(f"- parsed: **{m['total_parsed']}**")
          print(f"- alive: **{m['alive']}** ({m['alive_rate']}%)")
          print(f"- elapsed: {m['elapsed_ms']} ms")
          print("")
          print("| scheme | count |")
          print("|---|---|")
          from collections import Counter
          for k, v in Counter(n["scheme"] for n in d["nodes"]).most_common():
              print(f"| {k} | {v} |")
          PY
          else
            echo "no output produced" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit changes
        run: |
          git config user.name  "nodefusion-bot"
          git config user.email "nodefusion-bot@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            ALIVE=$(python -c "import json;print(json.load(open('out/nodes.json',encoding='utf-8'))['count'])")
            git commit -m "chore: update nodes (${ALIVE} alive) $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi